name: Django CI

on:
  push:
    branches: [production, stage]
  pull_request:
    branches: [production, stage]

permissions: {}

# Cancel superseded PR runs so we don't waste minutes on stale commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect which parts of the repo changed so we can skip irrelevant work.
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            backend:
              - 'registration/*.py'
              - 'registration/management/**'
              - 'registration/migrations/**'
              - 'registration/static/**'
              - 'registration/templates/**'
              - 'registration/templatetags/**'
              - 'registration/tests/**'
              - 'registration/utils/**'
              - 'registration/views/**'
              - 'fm_eventmanager/**'
              - 'manage.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.coveragerc'
              - '.tool-versions'
              - '.github/workflows/django.yml'
            frontend:
              - 'registration/frontend/**'
              - '.github/workflows/django.yml'

  frontend:
    name: Frontend build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: registration/frontend/package-lock.json
      - name: Install dependencies
        working-directory: registration/frontend
        run: npm ci --ignore-scripts
      - name: Build frontend
        working-directory: registration/frontend
        run: npm run build

  backend:
    name: Backend tests
    needs: changes
    # Frontend-only changes still run the backend because templates reference
    # the Vite-built bundle. Keep them in sync.
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        python-version: ["3.13", "3.14"]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      gotenberg:
        image: gotenberg/gotenberg:8
        options: >-
          --health-cmd "curl --fail http://localhost:3000/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3000:3000

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Login to Docker Hub (read-only)
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --frozen --no-build
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: registration/frontend/package-lock.json
      - name: Build frontend
        working-directory: registration/frontend
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Run Tests
        run: |
          cp fm_eventmanager/settings.py.ci fm_eventmanager/settings.py
          uv run --frozen --no-build --no-sync python ./manage.py collectstatic --noinput --skip-checks
          uv run --frozen --no-build --no-sync coverage run ./manage.py test registration
        env:
          SQUARE_APPLICATION_ID: ${{ secrets.SQUARE_APPLICATION_ID }}
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
      - name: Submit coverage
        run: uv run --frozen --no-build --no-sync coveralls --service=github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_FLAG_NAME: ${{ matrix.test-name }}
          COVERALLS_PARALLEL: true

  coveralls:
    name: Indicate completion to coveralls.io
    needs: backend
    runs-on: ubuntu-24.04
    container: python:3-alpine
    steps:
    - name: Install coveralls
      run: pip3 install --only-binary :all: coveralls==4.1.0
    - name: Finished
      run: coveralls --finish
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Aggregator job that always runs so it can serve as the single required
  # status check in branch protection. It passes when every gated job either
  # succeeded or was skipped because no relevant files changed.
  build:
    name: build
    needs: [changes, frontend, backend]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required jobs succeeded or were skipped
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
        run: |
          set -euo pipefail
          if [[ "${CHANGES_RESULT}" != "success" ]]; then
            echo "changes job did not succeed: ${CHANGES_RESULT}"
            exit 1
          fi
          for r in "${FRONTEND_RESULT}" "${BACKEND_RESULT}"; do
            case "${r}" in
              success|skipped) ;;
              *)
                echo "Required job failed: ${r}"
                exit 1
                ;;
            esac
          done
          echo "All required jobs passed."
