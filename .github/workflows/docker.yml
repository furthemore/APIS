name: Build & Deploy

on:
  # Manually triggered from the UI
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        type: environment

  # Dependency to a forking workflow
  #workflow_run:
  #  workflows: ["Django CI"]
  #  types: [completed]

permissions: {}

jobs:
  build_docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    environment: ${{ github.event.inputs.environment }}
    concurrency: ${{ github.event.inputs.environment }}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Set up QEMU
      uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

    - name: Login to packages container registry
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
      with:
        images: ghcr.io/furthemore/apis
        tags: |
          type=raw,value=${{ github.event.inputs.environment }}
          type=raw,value=latest

    - name: Build and push multi-arch image
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: |
          type=registry,ref=ghcr.io/furthemore/apis:latest
          type=registry,ref=ghcr.io/furthemore/apis:production
        build-args: |
          SENTRY_RELEASE=${{ github.sha }}

    - name: Deploy to server
      uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
      env:
        DEPLOY_ENV: ${{ github.event.inputs.environment }}
      with:
        host: maaa-registration
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        proxy_host: ${{ secrets.SSH_HOST }}
        proxy_username: ${{ secrets.SSH_USERNAME }}
        proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
        envs: DEPLOY_ENV
        script: |
          cd /opt/docker
          docker-compose pull
          docker-compose up -d "apis-${DEPLOY_ENV}" "apis-${DEPLOY_ENV}-worker"
