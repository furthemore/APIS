name: Build & Deploy

on:
  # Manually triggered from the UI
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        type: environment

permissions: {}

jobs:
  build_docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    environment: ${{ github.event.inputs.environment }}
    concurrency: ${{ github.event.inputs.environment }}
    env:
      ECS_CLUSTER: maaa-prod
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Login to packages container registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ghcr.io/furthemore/apis
        tags: |
          type=raw,value=${{ github.event.inputs.environment }}
          type=raw,value=latest

    - name: Build and push multi-arch image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: |
          type=registry,ref=ghcr.io/furthemore/apis:latest
          type=registry,ref=ghcr.io/furthemore/apis:production
        build-args: |
          SENTRY_RELEASE=${{ github.sha }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
      with:
        role-to-assume: arn:aws:iam::783453695466:role/maaa-github-actions
        aws-region: us-east-2

    - name: Deploy to ECS (staging)
      id: deploy-staging
      if: github.event.inputs.environment == 'stage'
      run: |
        aws ecs update-service \
          --cluster $ECS_CLUSTER \
          --service apis-staging \
          --desired-count 1 \
          --force-new-deployment \
          --deployment-configuration "minimumHealthyPercent=0,maximumPercent=200"
        aws ecs wait services-stable \
          --cluster $ECS_CLUSTER \
          --services apis-staging

    - name: Rollback staging on failure
      if: failure() && steps.deploy-staging.outcome == 'failure'
      run: |
        aws ecs update-service \
          --cluster $ECS_CLUSTER \
          --service apis-staging \
          --desired-count 0

    - name: Deploy to ECS (production)
      if: github.event.inputs.environment == 'production'
      run: |
        aws ecs update-service \
          --cluster $ECS_CLUSTER \
          --service apis \
          --force-new-deployment
        aws ecs wait services-stable \
          --cluster $ECS_CLUSTER \
          --services apis
