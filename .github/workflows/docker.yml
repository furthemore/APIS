name: Build & Deploy

on:
  # Manually triggered from the UI
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        type: environment

  # Dependency to a forking workflow
  #workflow_run:
  #  workflows: ["Django CI"]
  #  types: [completed]

permissions: {}

jobs:
  build_docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    environment: ${{ github.event.inputs.environment }}
    concurrency: ${{ github.event.inputs.environment }}
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false
    - name: Get version from latest tag
      id: version
      run: |
        VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0-dev")
        SHA=$(git rev-parse --short HEAD)
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"

    - name: Install GlitchTip CLI
      run: |
        curl -sL "https://gitlab.com/glitchtip/glitchtip-cli/-/jobs/artifacts/v0.1.0/raw/artifacts/glitchtip-cli-linux-x86_64?job=build-linux-x86_64" -o /usr/local/bin/glitchtip-cli
        chmod +x /usr/local/bin/glitchtip-cli

    - name: Create GlitchTip release
      env:
        SENTRY_URL: ${{ vars.GLITCHTIP_URL }}
        SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
        SENTRY_ORG: ${{ vars.GLITCHTIP_ORG }}
        SENTRY_PROJECT: ${{ vars.GLITCHTIP_PROJECT }}
      run: | # zizmor: ignore[template-injection] values are from git describe in a prior step
        glitchtip-cli releases new ${{ steps.version.outputs.version }}
        glitchtip-cli releases set-commits ${{ steps.version.outputs.version }} --auto
        glitchtip-cli releases finalize ${{ steps.version.outputs.version }}

    - name: Login to packages container registry
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build image
      env:
        DEPLOY_ENV: ${{ github.event.inputs.environment }}
      run: | # zizmor: ignore[template-injection] values are from git describe in a prior step
        make build-docker-image VERSION=${{ steps.version.outputs.version }} GIT_SHA=${{ steps.version.outputs.sha }}
        make "tag-${DEPLOY_ENV}"

    - name: Deploy to server
      uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
      env:
        DEPLOY_ENV: ${{ github.event.inputs.environment }}
      with:
        host: maaa-registration
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        proxy_host: ${{ secrets.SSH_HOST }}
        proxy_username: ${{ secrets.SSH_USERNAME }}
        proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
        envs: DEPLOY_ENV
        script: |
          cd /opt/docker
          docker-compose pull
          docker-compose up -d "apis-${DEPLOY_ENV}" "apis-${DEPLOY_ENV}-worker"

    - name: Record GlitchTip deployment
      env:
        SENTRY_URL: ${{ vars.GLITCHTIP_URL }}
        SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
        SENTRY_ORG: ${{ vars.GLITCHTIP_ORG }}
        SENTRY_PROJECT: ${{ vars.GLITCHTIP_PROJECT }}
        DEPLOY_ENV: ${{ github.event.inputs.environment }}
      run: | # zizmor: ignore[template-injection] version is from git describe in a prior step
        glitchtip-cli deploys new ${{ steps.version.outputs.version }} --env "${DEPLOY_ENV}"
