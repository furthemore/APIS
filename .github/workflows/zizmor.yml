# Runs zizmor on every PR and push to main to catch unpinned or insecure
# GitHub Actions references before they land.
---
name: 🌈 GitHub Actions Security Analysis (zizmor)

on:
  push:
    branches: [production]
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  pull_request:
    branches: ["**"]
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'

permissions:
  contents: read

jobs:
  gha-lint:
    timeout-minutes: 30
    name: GitHub Actions lint
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint, zizmor, and ghalint
        uses: ne-sachirou/lint-gha-reviewdog@7de88fec59e1c9530b7dccd5e9f51594f8b2278b  # v0.0.15
        with:
          github_token: ${{ github.token }}
          toolset: all
