services:
  app:
    image: ghcr.io/furthemore/apis:latest
    build: .
    restart: always
    ports:
      - 8080:80
      - 8000:8000
    volumes:
      - ./registration:/app/registration
      - ./convention_event_manager_django_site/settings.py.docker:/app/convention_event_manager_django_site/settings.py
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres
    restart: always
    env_file:
      - database.env
    volumes:
      - database-data:/var/lib/postgresql/data

  redis:
    image: redis
    restart: always

volumes:
  database-data:
