[project]
name = "apis"
version = "0.25.0"
description = "Attendee registration software for fan conventions"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "celery[redis]>=5.6.3",
    "configobj>=5.0.9",
    "django~=6.0.3",
    "django-admin-env-notice~=1.0.1",
    "django-allauth[mfa]>=65.16.0",
    "django-extensions~=4.1",
    "django-idempotency-key~=1.3.0",
    "django-import-export~=4.4.0",
    "django-maintenance-mode~=0.22.0",
    "django-mathfilters~=1.0.0",
    "django-nested-admin>=4.1.1",
    "django-nested-inline~=0.4.6",
    "django-prometheus~=2.4.1",
    "django-redis~=6.0.0",
    "django-vite>=3.1.0",
    "django-widget-tweaks~=1.5.1",
    "freezegun>=1.4.0",
    "gotenberg-client~=0.13.1",
    "gunicorn>=25.0.1",
    "influxdb~=5.3.1",
    "influxdb-client~=1.50.0",
    "markuppy>=1.14",
    "paho-mqtt~=2.1.0",
    "pillow>=12.1.0",
    "psycopg[binary,pool]>=3.3.3",
    "pygments~=2.20.0",
    "pyjwt~=2.12.1",
    "pytz~=2026.1.post1",
    "qrcode~=8.2.0",
    "respx>=0.22.0",
    "sentry-sdk>=2.58.0",
    "soupsieve>=2.8.3",
    "squareup==44.0.1.20260122",
    "uvicorn>=0.40.0",
    "uvicorn-worker>=0.4.0",
]

[tool.uv.sources]
django-prometheus = { git = "https://github.com/django-commons/django-prometheus", rev = "ea2d559476675a688f82cc37fac22b796ec7bcba" }

[dependency-groups]
dev = [
    "coveralls>=4.1.0",
    "django-debug-toolbar~=6.3.0",
    "django-types>=0.22.0",
    "ruff>=0.15.11",
    "werkzeug>=3.1.5",
]
