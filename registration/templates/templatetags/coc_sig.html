{% load registration_tags static %}

<div class="mb-3">
  <div class="form-check">
    <input type="checkbox" id="agreeToRules" name="agreeToRules" class="form-check-input"
           required />
    <label class="form-check-label" for="agreeToRules">
      I agree to abide by the {{ event.name }} <a href="{{ event.codeOfConduct }}" target="_blank">Code of
      Conduct</a>. By registering for {{ event }} you attest that you are not listed on any sexual offender
      registry.
    </label>
    <div class="invalid-feedback">You must agree to the code of conduct to register.</div>
  </div>
</div>
<div>Please Sign Below:</div>
<canvas id="signature-pad" style="width:100%; height:200px; border: dashed darkgray; margin-bottom:10px; display:block; touch-action:none;"></canvas>
<button type='button' class="btn btn-sm btn-secondary mb-3" id="clear-signature">Clear Signature</button>

<script>
window.addEventListener("load", () => {
    var canvas = document.getElementById('signature-pad');

    function fillBg(ctx, dark) {
        ctx.fillStyle = dark ? '#2b3035' : '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function initCanvas() {
        var ratio = Math.max(window.devicePixelRatio || 1, 1);
        canvas.width = canvas.offsetWidth * ratio;
        canvas.height = canvas.offsetHeight * ratio;
        canvas.getContext('2d').scale(ratio, ratio);
    }

    function applyTheme() {
        var dark = document.documentElement.getAttribute('data-bs-theme') === 'dark';
        var existing = window._signaturePad ? window._signaturePad.toData() : [];
        fillBg(canvas.getContext('2d'), dark);
        if (window._signaturePad) {
            window._signaturePad.penColor = dark ? 'rgb(232,232,232)' : 'rgb(0,0,0)';
            if (existing.length) window._signaturePad.fromData(existing);
        }
    }

    initCanvas();

    var dark = document.documentElement.getAttribute('data-bs-theme') === 'dark';
    fillBg(canvas.getContext('2d'), dark);

    window._signaturePad = new SignaturePad(canvas, {
        backgroundColor: 'rgba(0,0,0,0)',
        penColor: dark ? 'rgb(232,232,232)' : 'rgb(0,0,0)'
    });

    new MutationObserver(applyTheme)
        .observe(document.documentElement, { attributes: true, attributeFilter: ['data-bs-theme'] });

    document.getElementById('clear-signature').addEventListener('click', function() {
        window._signaturePad.clear();
        applyTheme();
    });

    // Returns white-bg + black-ink PNG base64 for form submission regardless of current theme
    window.getSignatureBitmap = function() {
        var data = window._signaturePad.toData();
        var offscreen = document.createElement('canvas');
        offscreen.width = canvas.width;
        offscreen.height = canvas.height;
        var ctx = offscreen.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, offscreen.width, offscreen.height);
        var ratio = Math.max(window.devicePixelRatio || 1, 1);
        ctx.scale(ratio, ratio);
        var tempPad = new SignaturePad(offscreen, { penColor: 'rgb(0,0,0)', backgroundColor: 'rgba(0,0,0,0)' });
        tempPad.fromData(data);
        return offscreen.toDataURL('image/png').split(',')[1];
    };
});
</script>
