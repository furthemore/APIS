{% extends "staff/base.html" %}

{% block title %}No Access - Staff Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-warning mt-5">
            <div class="card-header bg-warning text-dark">
                <h4 class="mb-0"><i class="bi bi-exclamation-triangle"></i> Access Required</h4>
            </div>
            <div class="card-body text-center py-5">
                <i class="bi bi-shield-lock display-1 text-muted mb-3"></i>
                <h3>No Staff Profile Found</h3>
                <p class="text-muted mb-4">{{ message }}</p>
                <a href="{% url 'staff:openings' %}" class="btn btn-primary">
                    <i class="bi bi-briefcase"></i> View Open Positions
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
